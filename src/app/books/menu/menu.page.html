<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
      <ion-title>Seus Livros</ion-title>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row *ngFor="let book of books.getAll()">
      <ion-col>
        <ion-button (click)="gotoBook(book.id)"><ion-icon name="book-outline"></ion-icon></ion-button>
        <span>{{book.name}}</span>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
