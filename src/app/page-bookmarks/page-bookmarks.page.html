<ion-header>
  <ion-title>Bookmarks</ion-title>
</ion-header>
<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let page of pages;">
      <ion-button fill="outline" (click)="confirm(page)">{{page}}</ion-button>
    </ion-item>
<ion-footer>
  <ion-button color="medium" (click)="cancel()">Cancel</ion-button>
</ion-footer>
