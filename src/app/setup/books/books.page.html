<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
      <ion-title>Cadastro de Livros</ion-title>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col class="center-items" style="margin-left:1px">
        <ion-list>
          <ion-item>
            <ion-label>Cadastrar novo livro</ion-label><ion-input placeholder="Entre com um nome para o livro"
              [(ngModel)]="bookControl" (ionFocus)="resetError()" (keyup.enter)="onEnter()"></ion-input>
          </ion-item>
          <ion-item class="error-msg" *ngIf="errorMessage">
            {{errorMessage}}
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col class="center-items">
        <ion-list>
          <ion-item>
          <label>Escolha uma capa para o livro</label><ion-button size="small" (click)="getPicture()"><ion-icon name="image-outline"></ion-icon></ion-button>
          </ion-item>
          </ion-list>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-button (click)="add()" [disabled]="bookControl==''">Adicionar</ion-button>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <h1>LIVROS</h1>
      </ion-col>
    </ion-row>
  </ion-grid>
  <ion-grid  *ngFor="let book of books.getAll()">
    <ion-row>
      <ion-col size="auto" style="margin-left:20px;">{{book.name}}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col style="margin-right:20px;text-align:right">
        <ion-button color="secondary" routerLink="/setup/chapters/{{book.id}}"><ion-icon
            name="create-outline"></ion-icon></ion-button>
        <ion-button color="danger" (click)="del(book.name)"><ion-icon
            name="close-circle-outline"></ion-icon></ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
